<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Connect 4">
  <title>Connect 4</title>

  <!--
    Compact Connect 4 board fragment. Uses the same Night Owl tokens as the
    canvas renderer so the icon and the in-app board feel like the same
    artifact:
      #011627 — background.base (frame)
      #1d3b53 — background.medium (front face)
      #f07178 — accent.pink (player one)
      #7fdbca — accent.cyan (player two)
    The face is only two steps lighter than the frame, so at 16px a hairline
    keeps the board readable as a distinct shape rather than one dark blob.
    Designed at 32x32 viewBox; renders cleanly down to 16px and up to
    the 80px README hero.
  -->

  <!-- Board frame -->
  <rect width="32" height="32" rx="5" fill="#011627" />

  <!-- Board face -->
  <rect
    x="3"
    y="5"
    width="26"
    height="22"
    rx="3"
    fill="#1d3b53"
    stroke="#2c4f6b"
    stroke-width="0.75"
  />

  <!-- 2x2 grid of pieces — two coral on the diagonal, two mint on the other -->
  <circle cx="10" cy="11" r="3.3" fill="#f07178" />
  <circle cx="22" cy="11" r="3.3" fill="#7fdbca" />
  <circle cx="10" cy="21" r="3.3" fill="#7fdbca" />
  <circle cx="22" cy="21" r="3.3" fill="#f07178" />
</svg>
