<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!--
      Social preview. 1200x630 is the Open Graph standard; declaring the
      dimensions lets scrapers reserve the right box before the image loads.
      Regenerate public/connect4.png whenever the board theme changes — it's
      key art built from the app's own renderer, not a stock asset.
    -->
    <meta property="og:image" content="https://raw.githubusercontent.com/dangervalentine/react-connect4/refs/heads/master/public/connect4.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Connect 4 title art: the wordmark CONNECT 4 beside a dark slate board holding a mid-game pyramid of coral and mint discs."
    />

    <!--
      Night Owl base tone. Tints the mobile browser chrome and tells the UA to
      render native controls dark, so nothing light frames the app. Keep in
      sync with colors.background.base in src/theme.ts.
    -->
    <meta name="theme-color" content="#011627" />
    <meta name="color-scheme" content="dark" />

    <!--
      Google Fonts: Poppins for the display title ("CONNECT4" + modal headings)
      and Inter for body / UI. preconnect first so the actual stylesheet fetch
      doesn't pay the TLS handshake cost.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Connect4</title>
  </head>
  <body>
    <div id="root">
      <noscript>You need JavaScript in order to run this app.</noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
